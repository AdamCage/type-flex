[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "type-flex"
version = "0.1.0"
description = "Advanced type mapping system"
authors = [{name = "Your Name", email = "your.email@example.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "defusedxml>=0.7.1"
]

[project.optional-dependencies]
dev = ["pytest", "mypy", "flake8"]
